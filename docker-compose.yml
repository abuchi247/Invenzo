###############################################################################
# Development compose file
#
# This file mounts host source into the containers and publishes PostgreSQL and
# Redis on the host. It is for development and CI only.
#
# Production uses the standalone stack instead (never merged with this file,
# because Compose merges `volumes`/`ports` rather than replacing them):
#   docker compose -f docker-compose.production.yml up -d
###############################################################################

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invenzo-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${SECRET_KEY:-dev-secret-key-not-for-production}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - 'CORS_ORIGINS=["http://localhost:3000"]'
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JOB_QUEUE_NAME=${JOB_QUEUE_NAME:-arq:queue}
      - JOB_MAX_TRIES=${JOB_MAX_TRIES:-5}
      - JOB_BASE_BACKOFF_SECONDS=${JOB_BASE_BACKOFF_SECONDS:-1}
      - JOB_MAX_BACKOFF_SECONDS=${JOB_MAX_BACKOFF_SECONDS:-300}
      - JOB_TIMEOUT_SECONDS=${JOB_TIMEOUT_SECONDS:-300}
      - JOB_MAX_CONCURRENCY=${JOB_MAX_CONCURRENCY:-10}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invenzo-worker
    command: ["arq", "app.services.background_jobs.WorkerSettings"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${SECRET_KEY:-dev-secret-key-not-for-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JOB_QUEUE_NAME=${JOB_QUEUE_NAME:-arq:queue}
      - JOB_MAX_TRIES=${JOB_MAX_TRIES:-5}
      - JOB_BASE_BACKOFF_SECONDS=${JOB_BASE_BACKOFF_SECONDS:-1}
      - JOB_MAX_BACKOFF_SECONDS=${JOB_MAX_BACKOFF_SECONDS:-300}
      - JOB_TIMEOUT_SECONDS=${JOB_TIMEOUT_SECONDS:-300}
      - JOB_MAX_CONCURRENCY=${JOB_MAX_CONCURRENCY:-10}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The worker runs arq (no HTTP server), so the backend image's HEALTHCHECK
    # (which probes /health on port 8000) is not applicable here.
    healthcheck:
      disable: true
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_ variables are embedded in the client bundle during build.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: invenzo-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: invenzo-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-invenzo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: invenzo-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backup service (development — manual trigger only)
  #
  # Run an on-demand backup:
  #   docker-compose run --rm backup
  #
  # Run with a label (e.g. before a release):
  #   docker-compose run --rm -e BACKUP_LABEL=pre-release backup
  #
  # Backups land in ./backups/ on the host. The service shares the postgres
  # network so it can reach the database container by hostname.
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:15-alpine
    container_name: invenzo-backup
    profiles:
      - backup
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_DIR=/backups
      - BACKUP_RETAIN=${BACKUP_RETAIN:-30}
      - BACKUP_LABEL=${BACKUP_LABEL:-}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/restore.sh:/restore.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge
