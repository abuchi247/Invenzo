###############################################################################
# Production stack (standalone)
#
# Usage: docker compose -f docker-compose.production.yml up -d
#
# This file is intentionally NOT an override of docker-compose.yml. Compose
# merges list-valued keys (`volumes`, `ports`) instead of replacing them, so a
# `volumes: []` / `ports: []` override cannot remove the development source
# mounts or the published database ports declared in the development file.
# Production therefore declares the whole stack here:
#   - no host source mounts (the image is the artifact)
#   - PostgreSQL and Redis reachable only on the internal network
#   - application ports bound to the reverse-proxy interface, not 0.0.0.0
#   - Redis password enforced and supplied to the API and worker
#   - read-only root filesystem, no privilege escalation, non-root images
#
# Required variables (inject from the secret manager, never commit):
#   POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB
#   SECRET_KEY REDIS_PASSWORD
#   CORS_ORIGINS FRONTEND_BASE_URL NEXT_PUBLIC_API_URL
#   SMTP_HOST SMTP_FROM_EMAIL (SMTP_USERNAME/SMTP_PASSWORD when authenticated)
#   BACKUP_RETAIN (optional, default 30) BACKUP_SCHEDULE (optional, default daily 02:00 UTC)
# See OPERATIONS_RUNBOOK.md sections 2 and 3.
###############################################################################

x-backend-image: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    GIT_COMMIT: ${GIT_COMMIT:-unknown}
    BUILD_DATE: ${BUILD_DATE:-unknown}
    MIGRATION_HEAD: ${MIGRATION_HEAD:-unknown}

x-backend-environment: &backend-environment
  # The application identity is DML-only; Alembic uses MIGRATION_DATABASE_URL.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET_KEY: ${SECRET_KEY}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Trusted browser origins. Also used for the cookie-authentication origin
  # check on /api/v1/auth/refresh and /api/v1/auth/logout.
  CORS_ORIGINS: ${CORS_ORIGINS}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
  REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-asm_refresh}
  REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
  REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-strict}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-5242880}
  # Observability: telemetry is on by default; error tracking needs a DSN.
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
  TELEMETRY_SLOW_QUERY_THRESHOLD_MS: ${TELEMETRY_SLOW_QUERY_THRESHOLD_MS:-200}
  ERROR_TRACKER_ENABLED: ${ERROR_TRACKER_ENABLED:-true}
  ERROR_TRACKER_DSN: ${ERROR_TRACKER_DSN:-}
  ERROR_TRACKER_ENVIRONMENT: ${ERROR_TRACKER_ENVIRONMENT:-production}
  ERROR_TRACKER_RELEASE: ${ERROR_TRACKER_RELEASE:-${GIT_COMMIT:-unknown}}
  ERROR_TRACKER_SAMPLE_RATE: ${ERROR_TRACKER_SAMPLE_RATE:-1.0}
  JOB_QUEUE_NAME: ${JOB_QUEUE_NAME:-arq:queue}
  JOB_MAX_TRIES: ${JOB_MAX_TRIES:-5}
  JOB_BASE_BACKOFF_SECONDS: ${JOB_BASE_BACKOFF_SECONDS:-1}
  JOB_MAX_BACKOFF_SECONDS: ${JOB_MAX_BACKOFF_SECONDS:-300}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-300}
  JOB_MAX_CONCURRENCY: ${JOB_MAX_CONCURRENCY:-10}

x-smtp-environment: &smtp-environment
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  backend:
    build: *backend-build
    image: ${BACKEND_IMAGE:-invenzo-backend}:${IMAGE_TAG:-latest}
    container_name: invenzo-backend
    # Bound to the reverse-proxy interface. TLS terminates at the proxy.
    ports:
      - "${BACKEND_BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      <<: [*backend-environment, *smtp-environment]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    <<: *hardening

  worker:
    build: *backend-build
    image: ${BACKEND_IMAGE:-invenzo-backend}:${IMAGE_TAG:-latest}
    container_name: invenzo-worker
    # Overrides the image CMD, so the worker never runs migrations itself.
    command: ["arq", "app.services.background_jobs.WorkerSettings"]
    environment:
      <<: [*backend-environment, *smtp-environment]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The worker runs arq (no HTTP server), so the backend image's HEALTHCHECK
    # (which probes /health on port 8000) is not applicable here.
    healthcheck:
      disable: true
    networks:
      - app-network
    <<: *hardening

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        # NEXT_PUBLIC_API_URL is baked into the browser bundle at build time,
        # so it MUST be supplied as a build arg here (the runtime environment
        # value below cannot change an already-built client bundle). Rebuild
        # the frontend image whenever this URL changes.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: ${FRONTEND_IMAGE:-invenzo-frontend}:${IMAGE_TAG:-latest}
    container_name: invenzo-frontend
    ports:
      - "${FRONTEND_BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - app-network
    <<: *hardening

  postgres:
    image: postgres:15-alpine
    container_name: invenzo-postgres
    # No published ports: reachable only from the application network.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Scheduled database backup
  #
  # Runs pg_dump daily at 02:00 UTC and stores compressed custom-format dumps
  # in the named volume `backup-data`. Mount or copy from there to off-site
  # storage using your deployment platform's backup tooling or a sidecar.
  #
  # Tune with environment variables:
  #   BACKUP_RETAIN   Number of daily dumps to keep locally (default: 30)
  #   BACKUP_SCHEDULE Cron expression (default: daily at 02:00 UTC)
  #
  # Run an immediate on-demand backup (e.g. before a release):
  #   docker compose -f docker-compose.production.yml run --rm backup-runner
  #
  # The scheduler (ofelia) reads the job from the backup-runner container's
  # labels so both services must be running for the schedule to fire.
  # ---------------------------------------------------------------------------
  backup-runner:
    image: postgres:15-alpine
    container_name: invenzo-backup-runner
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETAIN: ${BACKUP_RETAIN:-30}
      BACKUP_LABEL: ${BACKUP_LABEL:-}
      # When set, backups are encrypted at rest (AES-256-CBC). Optional so
      # existing deployments keep working; the provision script generates one
      # per customer. restore.sh needs the same key to decrypt.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - backup-data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/restore.sh:/restore.sh:ro
    # Stay alive (idle) so the ofelia scheduler can `docker exec` the backup
    # script into this container on schedule (job-exec), and so operators can
    # `docker compose exec backup-runner ...` to inspect /backups. The backup
    # itself is NOT run at startup; it runs on the ofelia schedule, or on demand
    # via `docker compose run --rm backup-runner sh /backup.sh` (the explicit
    # command overrides the idle `command` below without touching entrypoint).
    #
    # Clear the postgres image's entrypoint so `command` (and any `run` override)
    # executes verbatim rather than being wrapped by docker-entrypoint.sh.
    #
    # postgres:15-alpine does not ship openssl, which backup.sh needs to
    # encrypt dumps at rest. Install it once at startup, then idle so the
    # ofelia scheduler can `docker exec sh /backup.sh` into this container.
    # If BACKUP_ENCRYPTION_KEY is unset, backups are plaintext and openssl is
    # simply unused.
    entrypoint: [""]
    command: ["sh", "-c", "apk add --no-cache openssl || echo 'WARN: openssl install failed; encrypted backups will fail until resolved'; exec tail -f /dev/null"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # ofelia reads this label to schedule the job
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup.schedule: "${BACKUP_SCHEDULE:-0 2 * * *}"
      ofelia.job-exec.backup.command: "sh /backup.sh"

  backup-scheduler:
    image: mcuadros/ofelia:latest
    container_name: invenzo-backup-scheduler
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - backup-runner
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: invenzo-redis
    # No published ports: reachable only from the application network.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      # Lets the health check authenticate without putting the password on the
      # redis-cli command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  # Backup dumps are stored in this named volume. Mount or copy to off-site
  # storage using your deployment platform's backup tooling or object storage.
  backup-data:
    driver: local

networks:
  app-network:
    driver: bridge
